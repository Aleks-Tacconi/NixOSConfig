background {
    monitor =
    path = ~/.hyprland-assets/wallpaper.jpg
    color = rgba(25, 20, 20, 1.0)
}

input-field {
    monitor =
    size = 300, 30
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.55
    dots_center = true
    outer_color = rgba(242, 243, 244, 0)
    inner_color = rgba(242, 243, 244, 0)
    font_color = rgba(242, 243, 244, 0.75)
    fade_on_empty = false
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    fail_transition = 300
    position = 0, -470
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%k:%M")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 93
    font_family = SF Pro Display Bold
    position = 0, 253
    halign = center
    valign = center
}

label {
    monitor =
    text = Aleks Tacconi
    color = rgba(242, 243, 244, 0.75)
    font_size = 12
    font_family = SF Pro Display Bold
    position = 0, -407
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter Password
    color = rgba(242, 243, 244, 0.75)
    font_size = 10
    font_family = SF Pro Display
    position = 0, -440
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.hyprland-assets/icon.png
    border_size = 0
    size = 73
    rounding = -1
    position = 0, -350
    halign = center
    valign = center
}
