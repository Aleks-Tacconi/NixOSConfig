id = "aleks.worktree-bootstrap"
name = "Worktree Bootstrap"
version = "0.1.0"
min_herdr_version = "0.7.3"
description = "Start Neovim and OpenCode in Git worktree workspaces"
platforms = ["linux"]

[[actions]]
id = "bootstrap"
title = "Bootstrap editor and agent tabs"
contexts = ["workspace"]
command = ["bash", "bootstrap.sh"]

[[events]]
on = "worktree.created"
command = ["bash", "bootstrap.sh"]

[[panes]]
id = "agent"
title = "Agent"
placement = "tab"
command = ["/home/aleks/.opencode/bin/opencode"]
