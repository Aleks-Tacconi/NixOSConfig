[general]
mode = context
follow_monitor = false
show_workspace_badge = true
dismiss_modifier = alt

[theme]
name = waybar.ini
border_width = 1
corner_radius = 3

[layout]
card_width = 208
card_height = 176
card_gap = 12
padding = 14
max_cols = 5
icon_size = 72
icon_radius = 3

[icons]
theme = Papirus-Dark
fallback = Adwaita
show_letter_fallback = true

[font]
family = Fira Sans Semibold
weight = Bold
title_size = 11
icon_letter_size = 24
